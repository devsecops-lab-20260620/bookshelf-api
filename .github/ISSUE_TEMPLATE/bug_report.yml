name: "🐞 Bug Report"
description: "不具合の報告はこちら"
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生した問題を簡潔に説明してください
      placeholder: 例）src/ のビルド時にエラーが発生する
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題を再現するための手順を記載してください
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      placeholder: 本来どう動くべきかを書いてください
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      placeholder: 実際にどう動いたかを書いてください
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      placeholder: 必要に応じて貼り付けてください
