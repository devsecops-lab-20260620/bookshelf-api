name: "✨ Feature Request"
description: "新機能の提案はこちら"
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 提案内容
      placeholder: 追加したい機能を説明してください
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 理由
      placeholder: なぜこの機能が必要なのかを書いてください
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      placeholder: 他に考えた方法があれば記載してください
